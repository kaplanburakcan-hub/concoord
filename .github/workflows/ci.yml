# Concord — CI / Kalite Kapısı (Geliştirme Planı, Faz A)
#
# Her PR ve main'e her push'ta çalışır. `quality-gate` işi diğer tüm işlerin
# sonucunu toplar; branch protection'da zorunlu tek kontrol olarak bu iş
# seçilir (bkz. docs/kalite-kapisi.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MIGRATE_VERSION: v4.17.1

jobs:
  backend:
    name: Backend (fmt, vet, test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt ile biçimlendirilmemiş dosyalar (düzeltmek için: cd backend && gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: RBAC yetki matrisi
        run: go test -count=1 -v -run 'TestRoleEndpointAuthorizationMatrix|TestDecidePrecedence|TestRoleDefaultsReferenceRealPermissions|TestAdminHasEverything|TestPermissionDictionaryConsistent' ./internal/rbac/
      - name: go test -race
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript type-check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Birim/bileşen testleri (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  migrations-api-smoke:
    name: Migration round-trip + API smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ipks
          POSTGRES_PASSWORD: ipks
          POSTGRES_DB: ipks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipks -d ipks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IPKS_DB_DSN: postgres://ipks:ipks@localhost:5432/ipks?sslmode=disable
      IPKS_ENV: ci
      IPKS_JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      IPKS_BOOTSTRAP_ADMIN_EMAIL: admin@ipks.local
      IPKS_BOOTSTRAP_ADMIN_PASSWORD: CiAdmin!2345
      # MinIO bu işte yok; doküman uçları smoke kapsamında değil. Kapalı bir
      # porta işaret ederek bucket hazırlığının hızlıca başarısız olması sağlanır.
      IPKS_S3_ENDPOINT: 127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: migrate CLI kur
        run: |
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin migrate
          migrate -version
      - name: Migration up → down → up (temiz PostgreSQL)
        run: bash deploy/ci/migration-smoke.sh
      - name: API build
        working-directory: backend
        run: go build -o /tmp/ipks-api ./cmd/api
      - name: Seed
        run: /tmp/ipks-api -seed
      - name: API başlat
        run: |
          nohup /tmp/ipks-api > /tmp/ipks-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::API 30 sn içinde hazır olmadı"
          cat /tmp/ipks-api.log
          exit 1
      - name: API smoke + kontrat testleri
        env:
          BASE_URL: http://localhost:8080
          ADMIN_EMAIL: admin@ipks.local
          ADMIN_PASS: CiAdmin!2345
        run: bash deploy/ci/api-smoke.sh
      - name: API logu (hata durumunda)
        if: failure()
        run: tail -n 200 /tmp/ipks-api.log || true

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [backend, frontend, migrations-api-smoke, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Tüm kontroller geçti mi?
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Kalite kapısı başarısız — yukarıdaki işlere bakın."
            exit 1
          fi
          echo "Kalite kapısı geçti."
