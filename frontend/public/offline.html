<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>İPKS — Çevrimdışı</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #16181d;
        color: #e6e8ec;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        text-align: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        margin: 0 auto 20px;
        background: #2a2f3a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #a9afba; margin: 0 0 20px; }
      button {
        background: #3b82f6;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        cursor: pointer;
      }
      button:active { background: #2f6fd6; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">📶</div>
      <h1>Çevrimdışısınız</h1>
      <p>
        İnternet bağlantısı kurulamadı. Sahada girdiğiniz günlük rapor ve İSG
        verileri cihazınızda güvenle bekliyor; bağlantı geldiğinde otomatik olarak
        sunucuya gönderilecek. Kaydettiğiniz veriler kaybolmaz.
      </p>
      <button onclick="location.reload()">Yeniden dene</button>
    </div>
    <script>
      // Bağlantı geri gelince otomatik olarak uygulamaya dön.
      window.addEventListener("online", () => location.replace("/"));
    </script>
  </body>
</html>
