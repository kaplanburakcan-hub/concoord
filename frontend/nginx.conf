server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass https://concoord-backend.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header Host concoord-backend.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_verify off;
    }
    location / { try_files $uri /index.html; }
}

