<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00142e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <title>İPKS — İnşaat Proje Koordinasyon ve Saha Takip</title>
    <!-- Liberation Sans (SIL OFL) — hakediş raporlarıyla aynı yazı tipi; /fonts altından sunulur. -->
    <link rel="preload" href="/fonts/LiberationSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/LiberationSans-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      // Boyamadan önce temayı ayarla (varsayılan: light) — flaş olmasın.
      try {
        var t = localStorage.getItem("ipks-theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
        document.querySelector('meta[name=theme-color]')
          .setAttribute("content", t === "dark" ? "#000f22" : "#00142e");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
