# İPKS — geliştirme ortamı
# Kullanım: kökten `make up` (docker compose -f deploy/docker-compose.yml --env-file .env up -d)
name: ipks

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
        -c wal_level=replica
        -c archive_mode=on
        -c archive_command='test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$IPKS_S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      IPKS_S3_BUCKET: ${IPKS_S3_BUCKET}

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ../backend/migrations:/migrations:ro
    entrypoint: ["migrate", "-path=/migrations", "-database", "${IPKS_DB_DSN}"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../backend
    entrypoint: ["/app/api"]
    environment: &appenv
      IPKS_ENV: ${IPKS_ENV}
      IPKS_HTTP_ADDR: ${IPKS_HTTP_ADDR}
      IPKS_LOG_LEVEL: ${IPKS_LOG_LEVEL}
      IPKS_DB_DSN: ${IPKS_DB_DSN}
      IPKS_S3_ENDPOINT: ${IPKS_S3_ENDPOINT}
      IPKS_S3_PUBLIC_ENDPOINT: ${IPKS_S3_PUBLIC_ENDPOINT:-}
      IPKS_S3_ACCESS_KEY: ${IPKS_S3_ACCESS_KEY}
      IPKS_S3_SECRET_KEY: ${IPKS_S3_SECRET_KEY}
      IPKS_S3_BUCKET: ${IPKS_S3_BUCKET}
      IPKS_S3_REGION: ${IPKS_S3_REGION:-us-east-1}
      IPKS_S3_USE_SSL: ${IPKS_S3_USE_SSL}
      IPKS_JWT_SECRET: ${IPKS_JWT_SECRET}
      IPKS_ACCESS_TTL: ${IPKS_ACCESS_TTL:-15m}
      IPKS_REFRESH_TTL: ${IPKS_REFRESH_TTL:-720h}
      IPKS_RESET_TTL: ${IPKS_RESET_TTL:-1h}
      IPKS_BOOTSTRAP_ADMIN_EMAIL: ${IPKS_BOOTSTRAP_ADMIN_EMAIL:-admin@ipks.local}
      IPKS_BOOTSTRAP_ADMIN_PASSWORD: ${IPKS_BOOTSTRAP_ADMIN_PASSWORD:-}
      IPKS_SMTP_HOST: ${IPKS_SMTP_HOST:-}
      IPKS_SMTP_PORT: ${IPKS_SMTP_PORT:-587}
      IPKS_SMTP_USER: ${IPKS_SMTP_USER:-}
      IPKS_SMTP_PASS: ${IPKS_SMTP_PASS:-}
      IPKS_SMTP_FROM: ${IPKS_SMTP_FROM:-}
      IPKS_SMS_PROVIDER: ${IPKS_SMS_PROVIDER:-}
      IPKS_SMS_API_URL: ${IPKS_SMS_API_URL:-}
      IPKS_SMS_USER: ${IPKS_SMS_USER:-}
      IPKS_SMS_PASS: ${IPKS_SMS_PASS:-}
      IPKS_SMS_HEADER: ${IPKS_SMS_HEADER:-}
      # Faz 6 — hava durumu ön doldurma (opsiyonel; kapalıyken dış çağrı yok)
      IPKS_WEATHER_ENABLED: ${IPKS_WEATHER_ENABLED:-false}
      IPKS_WEATHER_API_URL: ${IPKS_WEATHER_API_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ../backend
    entrypoint: ["/app/worker"]
    environment: *appenv
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  wal_archive:
